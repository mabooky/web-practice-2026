<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7주차 실습 - 카드 컬렉션</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1>My Card Collection</h1>
        <p>transform · transition · animation 실습</p>
    </header>

    <section class="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
    </section>

    <main class="card-list">
        <article class="card">
            <div class="card-img">
                <img src="https://picsum.photos/seed/card1/400/300" alt="카드 1 이미지">
            </div>
            <div class="card-body">
                <h2>Card 1</h2>
                <p>카드에 대한 짧은 설명이 들어갑니다.</p>
                <button type="button" class="btn">자세히 보기</button>
            </div>
        </article>

        <article class="card">
            <div class="card-img">
                <img src="https://picsum.photos/seed/card2/400/300" alt="카드 2 이미지">
            </div>
            <div class="card-body">
                <h2>Card 2</h2>
                <p>카드에 대한 짧은 설명이 들어갑니다.</p>
                <button type="button" class="btn">자세히 보기</button>
            </div>
        </article>

        <article class="card">
            <div class="card-img">
                <img src="https://picsum.photos/seed/card3/400/300" alt="카드 3 이미지">
            </div>
            <div class="card-body">
                <h2>Card 3</h2>
                <p>카드에 대한 짧은 설명이 들어갑니다.</p>
                <button type="button" class="btn">자세히 보기</button>
            </div>
        </article>

        <article class="card">
            <div class="card-img">
                <img src="https://picsum.photos/seed/card4/400/300" alt="카드 4 이미지">
            </div>
            <div class="card-body">
                <h2>Card 4</h2>
                <p>카드에 대한 짧은 설명이 들어갑니다.</p>
                <button type="button" class="btn">자세히 보기</button>
            </div>
        </article>
    </main>
</body>

</html>
