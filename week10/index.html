<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10주차 실습 미션 - 햄버거 메뉴 · 다크모드 버튼</title>

    <style>
        /* ===== 기본 스타일 (수정 금지) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.6;
            word-break: keep-all;
            background: var(--bg);
            color: var(--text);
        }

        ul {
            list-style: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gnb {
            flex-basis: 100%;
        }

        .hero {
            padding: 64px 24px 32px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .hero p {
            opacity: 0.7;
        }

        .card-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
        }

        .card {
            padding: 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .card p {
            opacity: 0.7;
        }

        .footer {
            padding: 32px 24px;
            text-align: center;
            opacity: 0.6;
        }


        /* ===== 여기부터 실습 과제 작성 ===== */

        /* [미션 1-2] 햄버거 메뉴 CSS
       - .menu-btn : 메뉴 버튼 스타일
       - .gnb : 평소에는 숨김
       - .gnb.open : open 클래스가 붙으면 표시 */
        .menu-btn {
            width: 40px;
            height: 40px;
        }

        .gnb {        
            display: none;
            position: absolute;
            top: 64px;
            right: 24px;
            padding: 16px;
            text-align: end;
            background-color: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 4px 8px var(--shadow);
            border-radius: 16px;
        }

        .gnb > ul {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .gnb.open {
            display: block;
        }

        /* [미션 2-2] 다크모드 CSS
       - :root : 변수 정의 (--bg, --card, --text, --border) 라이트 색상
       - body.dark-mode : 같은 변수의 다크 색상으로 덮어쓰기
       - .theme-btn : 다크모드 버튼 스타일 */
        :root {
            --bg: #fffdf7;
            --card: #fffbeb;
            --text: #232323;
            --border: #e0d9c2;

            /* 꾸미기용 그림자 색상 변수 정의 */
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg: #232323;
            --card: #2c2c2c;
            --text: #fffdf7;
            --border: #4d4d4d;

            /* 꾸미기용 그림자 색상 변수 정의 */
            --shadow: rgba(185, 185, 185, 0.1);
        }

        .theme-btn {
            height: 40px;
            padding-inline: 16px;
        }

        /* 버튼 공통 스타일 작성 */
        button {
            position: relative;
            cursor: pointer;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: transparent;
            color: var(--text);
        }
    </style>
</head>

<body>

    <header class="header">
        <a class="logo" href="#">JNU Cafe</a>

        <div class="header-right">
            <!-- [미션 2-1] 다크모드 버튼 HTML (class="theme-btn", 문구: 다크모드) -->
            <button class="theme-btn accent">다크모드</button>

            <!-- [미션 1-1] 햄버거 메뉴 버튼 HTML (class="menu-btn", 문구: ☰ 문자를 복사해서 사용) -->
            <button class="menu-btn">☰</button>
        </div>

        <!-- [미션 1-1] 메뉴 nav HTML (class="gnb", 메뉴 4개: 홈 · 메뉴 · 매장 안내 · 문의) -->
        <nav class="gnb">
            <ul>
                <li>홈</li>
                <li>메뉴</li>
                <li>매장 안내</li>
                <li>문의</li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>오늘도 따뜻한 한 잔</h1>
            <p>직접 로스팅한 원두로 내린 커피를 만나 보세요.</p>
        </section>

        <section class="card-list">
            <article class="card">
                <h2>아메리카노</h2>
                <p>깔끔한 산미와 고소한 여운의 대표 메뉴</p>
            </article>
            <article class="card">
                <h2>카페라떼</h2>
                <p>부드러운 우유 거품과 에스프레소의 조화</p>
            </article>
            <article class="card">
                <h2>수제 쿠키</h2>
                <p>매일 아침 굽는 바삭하고 달콤한 디저트</p>
            </article>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 JNU Cafe. All rights reserved.</p>
    </footer>


    <script>
        /* ===== 여기부터 실습 과제 작성 ===== */

        /* [미션 1-3] 햄버거 메뉴 JS
           - 메뉴 버튼과 .gnb 요소를 변수에 저장
           - 버튼을 클릭하면 .gnb 에 open 클래스 켜기/끄기 */
        const menuBtn = document.querySelector('.menu-btn');
        const gnb = document.querySelector('.gnb');

        menuBtn.addEventListener('click', () => {
            gnb.classList.toggle('open');
        });

        /* [미션 2-3] 다크모드 버튼 JS
           - 다크모드 버튼을 변수에 저장
           - 버튼을 클릭하면 body 에 dark-mode 클래스 켜기/끄기
           - 현재 모드에 맞게 버튼 문구 바꾸기 (다크모드 ↔ 라이트모드) */
        const themeBtn = document.querySelector('.theme-btn');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeBtn.textContent = '라이트모드';
            } else {
                themeBtn.textContent = '다크모드';
            }
        });
    </script>
</body>

</html>
